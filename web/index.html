<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fairy Journal</title>
<style>
/*
 * Look based on the Typora theme PinkFairy by ShimuGuyue
 * (MIT licence, see PINKFAIRY-LICENSE.txt)
 * https://github.com/ShimuGuyue/typora-theme-PinkFairy
 * Image shadows from the original are left out on purpose.
 */
:root {
  --color-pink-soft:   #FF9EC8;
  --color-pink-hot:    #FF77CC;
  --color-pink-light:  #ffaaff;
  --color-pink-bright: #FFEEF8;
  --color-pink-peach:  #F39ACD;
  --color-pink-tender: #FFF0F5;
  --color-purple-herrscher: #6D6AA7;
  --text: #333;

  --fontsize-title1: 2.50rem;
  --fontsize-title2: 2.00rem;
  --fontsize-title3: 1.80rem;
  --fontsize-title4: 1.55rem;
  --fontsize-normal: 1.25rem;
  --fontsize-small:  1.00rem;

  --font-body: "FangSong", "STFangsong", "Courier New", monospace;
  --font-head: "Microsoft YaHei", "PingFang SC", -apple-system,
               sans-serif;
  --font-em:   "Consolas", "STXingkai", "Courier New", monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; background: #fff; color: var(--text);
  font-size: 16px;
}
body { -webkit-user-select: none; cursor: default; }

/* --- top bar --- */
.bar {
  position: sticky; top: 0; z-index: 2;
  display: flex; justify-content: flex-end; gap: 10px;
  padding: 12px 22px 10px 90px;   /* room for window buttons */
  background: #fff;
  -webkit-app-region: drag;
}
.bar button {
  -webkit-app-region: no-drag;
  font: bold 0.95rem var(--font-head);
  color: var(--color-pink-hot);
  background: var(--color-pink-tender);
  border: 1px solid var(--color-pink-soft);
  border-radius: 999px;
  padding: 6px 16px; cursor: pointer;
}
.bar button:hover { background: var(--color-pink-bright); }
.bar button[hidden] { display: none; }

/* --- the page (like Typora's #write) --- */
#page {
  max-width: 820px; margin: 0 auto;
  padding: 10px 40px 40vh;
}
.write {
  overflow-wrap: break-word;
  font-size: var(--fontsize-normal);
  font-family: var(--font-body);
  line-height: 1.6;
  font-weight: bold;
}
.write h1, .write h2, .write h3, .write h4 {
  font-family: var(--font-head);
  color: var(--color-pink-soft);
  line-height: 1.3;
  margin: 0.6em 0 0.3em;
}
.write h1 { font-size: var(--fontsize-title1); }
.write h2 { font-size: var(--fontsize-title2); }
.write h3 { font-size: var(--fontsize-title3); }
.write h4 { font-size: var(--fontsize-title4); }
.write h1::before { content: "❀ "; }
.write h1::after  { content: " ❀"; }
.write h2::before { content: "➳ "; }
.write h2::after  { content: " ➳"; }
.write h3::before { content: "♥ "; }
.write h3::after  { content: " ♥"; }
.write h4::before { content: "♪ "; }
.write h4::after  { content: " ♪"; }

hr {
  background-image: repeating-linear-gradient(-45deg,
    var(--color-pink-soft), var(--color-pink-soft) 6px,
    transparent 8px, transparent 12px);
  height: 3px; margin: 25px 0; border: none;
}
.write i, .write em {
  font-family: var(--font-em);
  margin-right: 0.3em;
}
.write b, .write strong { color: var(--color-pink-hot); }

/* "secret ink": hidden until you point at it */
.write strike, .write s, .write del {
  background-color: var(--color-purple-herrscher);
  color: var(--color-purple-herrscher);
  border: 1px solid var(--color-purple-herrscher);
  border-radius: 3px;
  text-decoration: none;
  transition: background-color 0.2s ease, color 0.2s ease;
}
.write strike:hover, .write s:hover, .write del:hover {
  background-color: var(--color-pink-bright);
  color: var(--color-pink-soft);
  border: 1px dashed var(--color-pink-soft);
}

.write blockquote {
  font-size: var(--fontsize-small);
  border-left: 10px solid var(--color-pink-light);
  padding: 15px 30px 15px 20px;
  margin: 0.6em 0;
  background-color: var(--color-pink-bright);
  color: #8e8e93;
}
.write ul, .write ol {
  list-style: none;
  padding-left: calc(2 * var(--fontsize-normal));
  margin: 0.3em 0;
}
.write li { position: relative; }
.write ul > li::before,
.write ol > li::before {
  content: "❀";
  position: absolute;
  left: calc(-2 * var(--fontsize-normal));
  color: var(--color-pink-soft);
}
.write ol { counter-reset: outer-ol; }
.write ol > li::before {
  counter-increment: outer-ol;
  content: counter(outer-ol) ".";
}
.write ul ul > li::before, .write ol ul > li::before {
  content: "➳";
}

/* --- today page bits --- */
.sub {
  font: bold 0.95rem var(--font-head);
  color: var(--color-pink-peach);
  margin: -0.2em 0 0;
  -webkit-user-select: none;
}
#editor {
  min-height: 50vh; outline: none;
  -webkit-user-select: text; cursor: text;
  caret-color: var(--color-pink-hot);
  position: relative;
}
#editor.blank::before {
  content: "write anything… ♪";
  position: absolute; pointer-events: none;
  color: var(--color-pink-soft); opacity: 0.7;
}
#editor ::selection, #editor::selection {
  background: var(--color-pink-bright);
}
.status {
  font: 0.85rem var(--font-head);
  color: #b9a3b0; margin-top: 2em;
}
#newday {
  font: bold 1rem var(--font-head);
  color: var(--color-pink-hot);
  background: var(--color-pink-tender);
  border: 1px dashed var(--color-pink-soft);
  border-radius: 12px;
  padding: 10px 16px; margin: 0 0 14px;
  display: flex; align-items: center; gap: 12px;
}
#newday[hidden] { display: none; }
#newday button {
  font: inherit; color: #fff;
  background: var(--color-pink-soft);
  border: none; border-radius: 999px;
  padding: 4px 14px; cursor: pointer;
}

/* --- old pages folder --- */
#folder details { margin: 0.2em 0 0.8em; }
#folder summary {
  list-style: none; cursor: pointer;
}
#folder summary::-webkit-details-marker { display: none; }
#folder summary h2 { display: inline; margin: 0; }
#folder summary .count {
  font: bold 0.9rem var(--font-head);
  color: var(--color-pink-peach); margin-left: 0.6em;
}
#folder h3 { font-size: 1.35rem; margin: 0.9em 0 0.2em; }
#folder li { cursor: pointer; padding: 2px 0; }
#folder li:hover .day { color: var(--color-pink-hot); }
#folder .day { color: var(--color-pink-soft); }
#folder .peek {
  color: #8e8e93; font-weight: normal;
  font-size: var(--fontsize-small);
}
.empty-note { color: #b9a3b0; font-family: var(--font-head); }

::-webkit-scrollbar { width: 14px; }
::-webkit-scrollbar-track {
  background: var(--color-pink-tender); border-radius: 7px;
}
::-webkit-scrollbar-thumb {
  border-radius: 7px; background-color: var(--color-pink-light);
  border: 2px solid transparent;
}
::-webkit-scrollbar-thumb:active {
  background-color: var(--color-pink-peach);
}
</style>
</head>
<body>
<div class="bar">
  <button id="toTodayBtn" hidden>♥ back to today</button>
  <button id="folderBtn">❀ old pages</button>
</div>

<div id="page">
  <section id="pageView" class="write">
    <div id="newday" hidden>
      <span>❀ it's a new day</span>
      <button id="turnBtn">turn the page ➳</button>
    </div>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <hr>
    <div id="editor" contenteditable="true"
         spellcheck="true" autocorrect="on"></div>
    <p class="status" id="status"></p>
  </section>

  <section id="folder" class="write" hidden>
    <h1>old pages</h1>
    <hr>
    <div id="folderList"></div>
  </section>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const editor = $("editor");

const S = {
  locale: undefined,
  firstWeekday: 1,      // 0 = Sunday, 1 = Monday
  pages: {},            // date -> html
  today: "",
  current: "",          // date shown in the editor
  mode: "today",        // today | past | folder
  pending: null,        // { date, html, empty }
  timer: 0,
  lastTyped: 0,
};

/* ---------- bridge to the Mac side ---------- */
const bridge = msg => {
  try {
    return window.webkit.messageHandlers.journal.postMessage(msg);
  } catch (e) {
    // opened in a plain browser: keep pages in memory only
    if (msg.op === "init") {
      return Promise.resolve({ firstWeekday: 2, pages: [] });
    }
    return Promise.resolve(true);
  }
};

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2, "0");
const keyOf = d =>
  `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dateOf = k => {
  const [y, m, d] = k.split("-").map(Number);
  return new Date(y, m - 1, d);
};
const todayKey = () => keyOf(new Date());
const fmt = (d, o) => {
  try { return d.toLocaleDateString(S.locale, o); }
  catch (e) { return d.toLocaleDateString(undefined, o); }
};

/* ---------- emptiness ---------- */
function isEmpty() {
  return editor.innerText.replace(/\s/g, "") === "";
}
function markBlank() {
  editor.classList.toggle("blank", isEmpty() &&
    !editor.querySelector("hr, li, blockquote, h1, h2, h3, h4"));
}

/* ---------- saving ---------- */
function queueSave() {
  S.pending = {
    date: S.current, html: editor.innerHTML, empty: isEmpty(),
  };
  clearTimeout(S.timer);
  S.timer = setTimeout(flush, 400);
  $("status").textContent = "…";
}
function flush() {
  clearTimeout(S.timer);
  const p = S.pending;
  S.pending = null;
  if (!p) return;
  if (p.empty) {
    delete S.pages[p.date];
    bridge({ op: "delete", date: p.date });
  } else {
    S.pages[p.date] = p.html;
    bridge({ op: "save", date: p.date, html: p.html });
  }
  setStatus();
}
// called by the app right before it quits
window.flushNow = () => {
  clearTimeout(S.timer);
  const p = S.pending;
  S.pending = null;
  return p;
};
function setStatus() {
  const kept = S.pages[S.current] !== undefined;
  if (S.current === S.today) {
    $("status").textContent = kept
      ? "saved ♥ this page stays"
      : "a blank page fades away at midnight";
  } else {
    $("status").textContent = kept ? "saved ♥" : "";
  }
}

/* ---------- views ---------- */
function openPage(date) {
  flush();
  S.current = date;
  S.mode = date === S.today ? "today" : "past";
  const d = dateOf(date);
  $("title").textContent =
    fmt(d, { weekday: "long", day: "numeric", month: "long" });
  $("sub").textContent = S.mode === "today"
    ? "today"
    : fmt(d, { year: "numeric" }) + " · an old page";
  editor.innerHTML = S.pages[date] || "";
  markBlank();
  setStatus();
  $("newday").hidden = true;
  $("pageView").hidden = false;
  $("folder").hidden = true;
  $("toTodayBtn").hidden = S.mode === "today";
  $("folderBtn").hidden = false;
  window.scrollTo(0, 0);
  if (S.mode === "today") placeCaretAtEnd();
}

function placeCaretAtEnd() {
  editor.focus();
  const r = document.createRange();
  r.selectNodeContents(editor);
  r.collapse(false);
  const s = getSelection();
  s.removeAllRanges();
  s.addRange(r);
}

function weekStart(d) {
  const back = (d.getDay() - S.firstWeekday + 7) % 7;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() - back);
}

function peek(html) {
  const t = document.createElement("div");
  t.innerHTML = html;
  const s = t.innerText.replace(/\s+/g, " ").trim();
  return s.length > 70 ? s.slice(0, 70) + "…" : s;
}

function openFolder() {
  flush();
  S.mode = "folder";
  const list = $("folderList");
  list.innerHTML = "";
  const dates = Object.keys(S.pages)
    .filter(k => k !== S.today).sort().reverse();

  if (!dates.length) {
    list.innerHTML = '<p class="empty-note">no old pages yet. ' +
      "the days you write on will gather here ♪</p>";
  }

  // month -> week -> days
  const months = [];
  for (const k of dates) {
    const d = dateOf(k);
    const mk = k.slice(0, 7);
    let m = months[months.length - 1];
    if (!m || m.key !== mk) {
      m = { key: mk, date: d, weeks: [] };
      months.push(m);
    }
    const ws = keyOf(weekStart(d));
    let w = m.weeks[m.weeks.length - 1];
    if (!w || w.key !== ws) {
      w = { key: ws, start: weekStart(d), days: [] };
      m.weeks.push(w);
    }
    w.days.push(k);
  }

  months.forEach((m, i) => {
    const det = document.createElement("details");
    if (i === 0) det.open = true;
    const sum = document.createElement("summary");
    const h2 = document.createElement("h2");
    h2.textContent = fmt(m.date, { month: "long", year: "numeric" });
    const count = document.createElement("span");
    count.className = "count";
    const n = m.weeks.reduce((a, w) => a + w.days.length, 0);
    count.textContent = n === 1 ? "1 page" : n + " pages";
    sum.append(h2, count);
    det.append(sum);

    for (const w of m.weeks) {
      const end = new Date(w.start.getFullYear(),
        w.start.getMonth(), w.start.getDate() + 6);
      const h3 = document.createElement("h3");
      h3.textContent = fmt(w.start, { day: "numeric", month: "short" })
        + " – " + fmt(end, { day: "numeric", month: "short" });
      const ul = document.createElement("ul");
      for (const k of w.days) {
        const li = document.createElement("li");
        const day = document.createElement("span");
        day.className = "day";
        day.textContent = fmt(dateOf(k),
          { weekday: "short", day: "numeric" });
        const pk = document.createElement("span");
        pk.className = "peek";
        pk.textContent = "  " + peek(S.pages[k]);
        li.append(day, pk);
        li.onclick = () => openPage(k);
        ul.append(li);
      }
      det.append(h3, ul);
    }
    list.append(det);
  });

  $("pageView").hidden = true;
  $("folder").hidden = false;
  $("toTodayBtn").hidden = false;
  $("folderBtn").hidden = true;
  window.scrollTo(0, 0);
}

/* ---------- writing shortcuts (like Typora) ---------- */
function currentBlock() {
  const s = getSelection();
  if (!s.rangeCount) return null;
  let n = s.anchorNode;
  while (n && n.parentNode !== editor && n !== editor) {
    n = n.parentNode;
  }
  return n;
}
function textBeforeCaret(block) {
  const s = getSelection();
  const r = document.createRange();
  r.setStart(block, 0);
  r.setEnd(s.anchorNode, s.anchorOffset);
  return r.toString();
}
function insideTag(tag) {
  let n = getSelection().anchorNode;
  while (n && n !== editor) {
    if (n.nodeName === tag) return n;
    n = n.parentNode;
  }
  return null;
}
const MARKS = {
  "#": "h1", "##": "h2", "###": "h3", "####": "h4",
  ">": "blockquote", "-": "ul", "*": "ul", "1.": "ol",
};

editor.addEventListener("keydown", e => {
  const cmd = e.metaKey || e.ctrlKey;
  if (cmd && !e.shiftKey && e.key === "b") {
    e.preventDefault(); document.execCommand("bold"); return;
  }
  if (cmd && !e.shiftKey && e.key === "i") {
    e.preventDefault(); document.execCommand("italic"); return;
  }
  if (cmd && e.shiftKey && e.key.toLowerCase() === "x") {
    e.preventDefault(); document.execCommand("strikeThrough");
    return;
  }

  const s = getSelection();
  if (!s.rangeCount || !s.isCollapsed) return;

  if (e.key === " " && !cmd) {
    const block = currentBlock();
    if (!block || insideTag("LI")) return;
    const kind = MARKS[textBeforeCaret(block)];
    if (!kind) return;
    e.preventDefault();
    const len = textBeforeCaret(block).length;
    for (let i = 0; i < len; i++) document.execCommand("delete");
    if (kind === "ul") document.execCommand("insertUnorderedList");
    else if (kind === "ol") document.execCommand("insertOrderedList");
    else document.execCommand("formatBlock", false, kind);
    return;
  }

  if (e.key === "Enter" && !e.shiftKey) {
    const block = currentBlock();
    const line = block ? block.textContent.trim() : "";
    if (line === "---" || line === "***") {
      e.preventDefault();
      const r = document.createRange();
      r.selectNodeContents(block.nodeType === 3 ? block : block);
      s.removeAllRanges(); s.addRange(r);
      document.execCommand("delete");
      document.execCommand("insertHorizontalRule");
      document.execCommand("insertParagraph");
      return;
    }
    // empty line in a quote or heading: step back to plain text
    const q = insideTag("BLOCKQUOTE");
    if (q && block && block.textContent === "") {
      e.preventDefault();
      document.execCommand("formatBlock", false, "div");
    }
  }
});

editor.addEventListener("paste", e => {
  e.preventDefault();
  const t = e.clipboardData.getData("text/plain");
  document.execCommand("insertText", false, t);
});

editor.addEventListener("input", () => {
  S.lastTyped = Date.now();
  markBlank();
  queueSave();
});
editor.addEventListener("blur", flush);

/* ---------- buttons ---------- */
$("folderBtn").onclick = openFolder;
$("toTodayBtn").onclick = () => openPage(S.today);
$("turnBtn").onclick = () => openPage(S.today);

/* ---------- midnight ---------- */
function checkDay() {
  const t = todayKey();
  if (t === S.today) return;
  S.today = t;
  if (S.mode === "today") {
    // writing right now? don't yank the page away
    if (Date.now() - S.lastTyped < 120000) {
      flush();
      $("sub").textContent = "yesterday";
      $("newday").hidden = false;
      S.mode = "past";
      $("toTodayBtn").hidden = false;
    } else {
      openPage(t);
    }
  } else if (S.mode === "folder") {
    openFolder();
  }
}
setInterval(checkDay, 20000);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) flush(); else checkDay();
});

/* ---------- start ---------- */
bridge({ op: "init" }).then(info => {
  S.locale = info.locale || undefined;
  S.firstWeekday = ((info.firstWeekday || 2) - 1) % 7;
  for (const p of info.pages || []) S.pages[p.date] = p.html;
  S.today = todayKey();
  openPage(S.today);
});
</script>
</body>
</html>
